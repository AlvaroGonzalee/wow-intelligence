[project]
name = "wow-intelligence"
version = "0.0.1"
description = "Local assistant for World of Warcraft: Forever (development scaffold)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "lingua-language-detector>=2.2.0",
]

[project.scripts]
wow-intelligence = "wow_intelligence.cli.chat:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wow_intelligence"
module-root = "src"
namespace = true

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]
